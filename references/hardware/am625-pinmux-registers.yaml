# AM625 PADCONFIG Register Reference
# Source: AM625 Technical Reference Manual (SPRUIV7A), Chapter 10
# Format: machine-readable YAML for skill use
#
# Skills use this file to look up PADCONFIG offsets without opening the TRM PDF.
# Only a representative subset is listed here. For the full table, see the TRM.
#
# padconfig_base:
#   main_pmx0: 0x000F4000  (MAIN domain pads — most GPIO)
#   mcu_pmx0:  0x04084000  (MCU domain pads — MCU_GPIO, MCU_UART, MCU_I2C)
#
# Each entry:
#   offset:        byte offset from domain base (hex)
#   ball:          SoC ball name from package pinout (Chapter 2)
#   default_func:  function at reset (mux_mode=0)
#   gpio_func:     GPIO configuration (mux_mode=7 for most pads)
#   gpio_bank:     Linux GPIO bank (0=GPIO0, 1=GPIO1, etc.)
#   gpio_line:     line number within bank
#   rxactive_bit:  18 (bit 18 of PADCONFIG, must set for inputs)
#   note:          special constraint or warning

padconfig_base:
  main_pmx0: "0x000F4000"
  mcu_pmx0:  "0x04084000"

padconfig_bit_fields:
  MUX_MODE:   {bits: "3:0",   description: "Pin function select (0=default, 7=GPIO for most)"}
  PULL_SEL:   {bits: "17:16", description: "Pull type (00=none, 01=pulldown, 10=none, 11=pullup)"}
  RXACTIVE:   {bit:  18,      description: "Enable input receiver. REQUIRED for all inputs. Most common GPIO bug."}
  WAKEUP_EN:  {bit:  29,      description: "Enable wakeup (deep sleep). Only MCU domain pads."}
  DS_EN:      {bits: "26:24", description: "Drive strength"}

# MAIN domain GPIO pads (partial list — most common K3 customer pins)
main_pmx0_pads:

  # UART / console
  - offset: "0x01e4"
    ball: "K24"
    default_func: "UART0_RXD"
    gpio_func: "GPIO0_14"
    gpio_bank: 0
    gpio_line: 14
    note: "AM62x SK console UART. Default function is UART — do not remap."

  - offset: "0x01e8"
    ball: "K23"
    default_func: "UART0_TXD"
    gpio_func: "GPIO0_15"
    gpio_bank: 0
    gpio_line: 15
    note: "AM62x SK console UART TX."

  # RPi header GPIO (most customer-accessible pins)
  - offset: "0x0194"
    ball: "W25"
    default_func: "GPMC0_WPn"
    gpio_func: "GPIO0_51"
    gpio_bank: 0
    gpio_line: 51
    note: "RPi header pin 11 (GPIO17 in RPi numbering) on SK-AM62x"

  - offset: "0x0198"
    ball: "V25"
    default_func: "GPMC0_DS"
    gpio_func: "GPIO0_52"
    gpio_bank: 0
    gpio_line: 52
    note: "RPi header pin 13 (GPIO27)"

  - offset: "0x019c"
    ball: "U25"
    default_func: "GPMC0_AD0"
    gpio_func: "GPIO0_53"
    gpio_bank: 0
    gpio_line: 53
    note: "RPi header pin 15 (GPIO22)"

  - offset: "0x01a0"
    ball: "T25"
    default_func: "GPMC0_AD1"
    gpio_func: "GPIO0_54"
    gpio_bank: 0
    gpio_line: 54
    note: "RPi header pin 16 (GPIO23)"

  - offset: "0x01a4"
    ball: "R25"
    default_func: "GPMC0_AD2"
    gpio_func: "GPIO0_55"
    gpio_bank: 0
    gpio_line: 55
    note: "RPi header pin 18 (GPIO24)"

  # I2C
  - offset: "0x0260"
    ball: "D17"
    default_func: "I2C0_SCL"
    gpio_func: "GPIO0_0"
    gpio_bank: 0
    gpio_line: 0
    note: "Main I2C bus SCL. Open-drain — do not set as push-pull output."

  - offset: "0x0264"
    ball: "C17"
    default_func: "I2C0_SDA"
    gpio_func: "GPIO0_1"
    gpio_bank: 0
    gpio_line: 1
    note: "Main I2C bus SDA. Open-drain."

  # SPI
  - offset: "0x01bc"
    ball: "R24"
    default_func: "SPI0_CLK"
    gpio_func: "GPIO0_60"
    gpio_bank: 0
    gpio_line: 60

  - offset: "0x01c0"
    ball: "P24"
    default_func: "SPI0_D0"
    gpio_func: "GPIO0_61"
    gpio_bank: 0
    gpio_line: 61

  - offset: "0x01c4"
    ball: "N25"
    default_func: "SPI0_D1"
    gpio_func: "GPIO0_62"
    gpio_bank: 0
    gpio_line: 62

  - offset: "0x01c8"
    ball: "M24"
    default_func: "SPI0_CS0"
    gpio_func: "GPIO0_63"
    gpio_bank: 0
    gpio_line: 63

  # PRU-ICSS pins (PRU0)
  - offset: "0x00d0"
    ball: "R14"
    default_func: "PRG0_PRU0_GPO0"
    gpio_func: "GPIO0_30"
    gpio_bank: 0
    gpio_line: 30
    note: "PRU0 direct output. Fast path via R30 register (no kernel overhead)."

  - offset: "0x00d4"
    ball: "R15"
    default_func: "PRG0_PRU0_GPO1"
    gpio_func: "GPIO0_31"
    gpio_bank: 0
    gpio_line: 31
    note: "PRU0 direct output."

  - offset: "0x00f4"
    ball: "P14"
    default_func: "PRG0_PRU0_GPI0"
    gpio_func: "GPIO0_38"
    gpio_bank: 0
    gpio_line: 38
    note: "PRU0 fast input. Read via R31 register."

# MCU domain pads
mcu_pmx0_pads:

  - offset: "0x0000"
    ball: "D3"
    default_func: "MCU_UART0_RXD"
    gpio_func: "MCU_GPIO0_0"
    gpio_bank: 0  # MCU_GPIO0
    gpio_line: 0
    note: "MCU UART0 — used for R5F debug console by default"

  - offset: "0x0008"
    ball: "A4"
    default_func: "MCU_I2C0_SCL"
    gpio_func: "MCU_GPIO0_8"
    gpio_bank: 0  # MCU_GPIO0
    gpio_line: 8

  - offset: "0x000c"
    ball: "B4"
    default_func: "MCU_I2C0_SDA"
    gpio_func: "MCU_GPIO0_9"
    gpio_bank: 0
    gpio_line: 9

# Domain note: MCU GPIO (MCU_GPIO0) appears as a separate gpiochip in Linux.
# On SK-AM62x it is typically gpiochip1. Linux GPIO bank numbers are:
#   gpiochip0 = MAIN GPIO0 (512 lines)
#   gpiochip1 = MCU_GPIO0  (24 lines)
# WARNING: gpiochip numbers are NOT guaranteed — use by-label lookup:
#   gpioinfo | grep "GPIO0"    <- identifies main domain chip
#   gpioinfo | grep "MCU_GPIO" <- identifies MCU chip
# Use gpioget/gpioset with chip-by-name for scripts, not hardcoded chip number.

# Mux mode reference (most MAIN domain pads)
mux_modes:
  0: "Default peripheral function (UART, I2C, SPI, etc.)"
  1: "Alternate function 1"
  2: "Alternate function 2"
  3: "Alternate function 3"
  4: "Alternate function 4"
  5: "Alternate function 5"
  6: "Alternate function 6"
  7: "GPIO (all MAIN domain PADCONFIG pads support mode 7 = GPIO)"

# DTS macro reference
dts_macros:
  AM625_IOPAD:
    format: "AM625_IOPAD(offset, muxmode | pullup_flags)"
    example: "AM625_IOPAD(0x01e4, PIN_INPUT | MUX_MODE7)  /* UART0_RXD as GPIO */"
    pullup_flags:
      PIN_INPUT:        "Sets RXACTIVE (bit 18). Required for reading digital inputs."
      PIN_OUTPUT:       "No RXACTIVE. Standard push-pull output."
      PIN_PULLUP_EN:    "Enable pull-up (PULL_SEL=11b)"
      PIN_PULLDOWN_EN:  "Enable pull-down (PULL_SEL=01b)"
      PIN_NOPULL:       "Disable pull (PULL_SEL=00b)"
    warning: >
      Forgetting PIN_INPUT on a GPIO configured as input causes reads to always return 0.
      This is the #1 GPIO bug on TI K3 platforms. Always set PIN_INPUT for any pad
      used as digital input, including I2C SDA/SCL (open-drain bidirectional).
