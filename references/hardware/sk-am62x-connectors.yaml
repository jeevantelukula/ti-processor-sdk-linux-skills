# SK-AM62x Board Connector Reference
# Source: SK-AM62x Schematic (check TI reference design page for latest revision)
# Board: SK-AM62x (SKEVM62x / TMDSEVM62x)
#
# This file maps physical connector pins to SoC balls and Linux GPIO names.
# Skills use this to translate user descriptions ("I want to drive pin 11 of
# the expansion header") to actual PADCONFIG offsets.

board: "SK-AM62x"
revision: "E3"
schematic_doc: "SK-AM62x-Schematic_RevE3.pdf"  # fill in documents.board_schematic

# ─── 40-pin RPi-compatible expansion header (J3) ────────────────────────────────
# Mechanical layout: 2x20 0.1" header
# Pinout matches Raspberry Pi HAT specification for power/I2C/SPI/UART pins

rpi_header:
  connector: "J3"
  description: "40-pin RPi-compatible expansion header"
  voltage: "3.3V GPIO (VDDSHV2_MCU domain), 5V power pins"

  pins:
    - pin: 1
      name: "3V3_PWR"
      type: "power"
      note: "3.3V output, 50mA max"

    - pin: 2
      name: "5V_PWR"
      type: "power"
      note: "5V input/output"

    - pin: 3
      name: "I2C1_SDA"
      soc_ball: "C17"
      padconfig_offset: "0x0264"
      linux_gpio: "GPIO0_1"
      gpio_chip: "gpiochip0"
      gpio_line: 1
      default_func: "I2C0_SDA"
      note: "Pull-up on board (4.7kΩ). Open-drain only."

    - pin: 4
      name: "5V_PWR"
      type: "power"

    - pin: 5
      name: "I2C1_SCL"
      soc_ball: "D17"
      padconfig_offset: "0x0260"
      linux_gpio: "GPIO0_0"
      gpio_chip: "gpiochip0"
      gpio_line: 0
      default_func: "I2C0_SCL"
      note: "Pull-up on board. Open-drain only."

    - pin: 6
      name: "GND"
      type: "power"

    - pin: 7
      name: "GPIO4"  # RPi BCM numbering
      soc_ball: "W25"
      padconfig_offset: "0x0194"
      linux_gpio: "GPIO0_51"
      gpio_chip: "gpiochip0"
      gpio_line: 51
      default_func: "GPMC0_WPn"

    - pin: 8
      name: "UART_TX"
      soc_ball: "K23"
      padconfig_offset: "0x01e8"
      linux_gpio: "GPIO0_15"
      gpio_chip: "gpiochip0"
      gpio_line: 15
      default_func: "UART0_TXD"
      note: "Linux serial console (ttyS0). Do not reconfigure without redirecting console."

    - pin: 9
      name: "GND"
      type: "power"

    - pin: 10
      name: "UART_RX"
      soc_ball: "K24"
      padconfig_offset: "0x01e4"
      linux_gpio: "GPIO0_14"
      gpio_chip: "gpiochip0"
      gpio_line: 14
      default_func: "UART0_RXD"
      note: "Linux serial console (ttyS0)."

    - pin: 11
      name: "GPIO17"  # RPi BCM numbering
      soc_ball: "W25"
      padconfig_offset: "0x0194"
      linux_gpio: "GPIO0_51"
      gpio_chip: "gpiochip0"
      gpio_line: 51
      default_func: "GPMC0_WPn"

    - pin: 12
      name: "GPIO18"
      soc_ball: "V25"
      padconfig_offset: "0x0198"
      linux_gpio: "GPIO0_52"
      gpio_chip: "gpiochip0"
      gpio_line: 52
      default_func: "GPMC0_DS"

    - pin: 13
      name: "GPIO27"
      soc_ball: "V25"
      padconfig_offset: "0x0198"
      linux_gpio: "GPIO0_52"
      gpio_chip: "gpiochip0"
      gpio_line: 52
      default_func: "GPMC0_DS"

    - pin: 14
      name: "GND"
      type: "power"

    - pin: 15
      name: "GPIO22"
      soc_ball: "U25"
      padconfig_offset: "0x019c"
      linux_gpio: "GPIO0_53"
      gpio_chip: "gpiochip0"
      gpio_line: 53

    - pin: 16
      name: "GPIO23"
      soc_ball: "T25"
      padconfig_offset: "0x01a0"
      linux_gpio: "GPIO0_54"
      gpio_chip: "gpiochip0"
      gpio_line: 54

    - pin: 17
      name: "3V3_PWR"
      type: "power"

    - pin: 18
      name: "GPIO24"
      soc_ball: "R25"
      padconfig_offset: "0x01a4"
      linux_gpio: "GPIO0_55"
      gpio_chip: "gpiochip0"
      gpio_line: 55

    - pin: 19
      name: "SPI0_MOSI"
      soc_ball: "P24"
      padconfig_offset: "0x01c0"
      linux_gpio: "GPIO0_61"
      gpio_chip: "gpiochip0"
      gpio_line: 61
      default_func: "SPI0_D0"

    - pin: 20
      name: "GND"
      type: "power"

    - pin: 21
      name: "SPI0_MISO"
      soc_ball: "N25"
      padconfig_offset: "0x01c4"
      linux_gpio: "GPIO0_62"
      gpio_chip: "gpiochip0"
      gpio_line: 62
      default_func: "SPI0_D1"

    - pin: 22
      name: "GPIO25"
      soc_ball: "Q25"
      padconfig_offset: ""  # verify in schematic
      linux_gpio: "GPIO0_57"

    - pin: 23
      name: "SPI0_SCLK"
      soc_ball: "R24"
      padconfig_offset: "0x01bc"
      linux_gpio: "GPIO0_60"
      gpio_chip: "gpiochip0"
      gpio_line: 60
      default_func: "SPI0_CLK"

    - pin: 24
      name: "SPI0_CE0"
      soc_ball: "M24"
      padconfig_offset: "0x01c8"
      linux_gpio: "GPIO0_63"
      gpio_chip: "gpiochip0"
      gpio_line: 63
      default_func: "SPI0_CS0"

    - pin: 25
      name: "GND"
      type: "power"

    - pin: 26
      name: "SPI0_CE1"
      soc_ball: ""  # verify in schematic
      linux_gpio: ""

    - pin: 27
      name: "I2C0_SDA"
      note: "ID EEPROM I2C. Not recommended for general GPIO."

    - pin: 28
      name: "I2C0_SCL"
      note: "ID EEPROM I2C."

    - pin: 29
      name: "GPIO5"
      soc_ball: ""  # verify in schematic
      linux_gpio: ""

    - pin: 30
      name: "GND"
      type: "power"

    - pin: 31
      name: "GPIO6"
      linux_gpio: ""

    - pin: 32
      name: "GPIO12"
      linux_gpio: ""

    - pin: 33
      name: "GPIO13"
      linux_gpio: ""

    - pin: 34
      name: "GND"
      type: "power"

    - pin: 35
      name: "GPIO19"
      linux_gpio: ""

    - pin: 36
      name: "GPIO16"
      linux_gpio: ""

    - pin: 37
      name: "GPIO26"
      linux_gpio: ""

    - pin: 38
      name: "GPIO20"
      linux_gpio: ""

    - pin: 39
      name: "GND"
      type: "power"

    - pin: 40
      name: "GPIO21"
      linux_gpio: ""

# ─── USB Ports ───────────────────────────────────────────────────────────────────
usb_ports:
  - name: "USB_C_OTG"
    connector: "J21"
    type: "USB Type-C"
    mode: "DRD (Device/Host)"
    note: "USB-C for power delivery and OTG. Use for SD card flashing with DFU."

  - name: "USB_HOST"
    connector: "J23"
    type: "USB Type-A"
    mode: "Host"
    note: "Standard USB Host port."

# ─── Serial Console ──────────────────────────────────────────────────────────────
serial_console:
  connector: "J25"
  type: "USB Type-C (USB-UART bridge)"
  chip: "CP2105"
  host_devices:
    - "/dev/ttyUSB0"  # MAIN UART (Linux console, 115200 8N1)
    - "/dev/ttyUSB1"  # MCU UART  (R5F console, 115200 8N1)
  note: >
    Two virtual COM ports. First (ttyUSB0) is Linux console.
    Second (ttyUSB1) is MCU R5F debug output.

# ─── JTAG ────────────────────────────────────────────────────────────────────────
jtag:
  connector: "J20"
  type: "60-pin CTI JTAG"
  note: "Connects to XDS110 embedded debug probe via USB. Use for A53/R5F JTAG debugging."

# ─── Boot Mode Switch ─────────────────────────────────────────────────────────────
boot_mode_switch:
  component: "SW1"
  description: "4-position DIP switch for boot mode selection"
  modes:
    - name: "SD Card Boot"
      sw1_1: "OFF"
      sw1_2: "OFF"
      sw1_3: "OFF"
      sw1_4: "OFF"
    - name: "eMMC Boot"
      sw1_1: "ON"
      sw1_2: "OFF"
      sw1_3: "OFF"
      sw1_4: "OFF"
    - name: "OSPI Boot"
      sw1_1: "OFF"
      sw1_2: "ON"
      sw1_3: "OFF"
      sw1_4: "OFF"
    - name: "UART Boot (DFU)"
      sw1_1: "OFF"
      sw1_2: "OFF"
      sw1_3: "ON"
      sw1_4: "OFF"

# ─── LEDs ────────────────────────────────────────────────────────────────────────
leds:
  - name: "USR_LED0"
    linux_label: "am62:green:heartbeat"
    gpio: "GPIO0_17"
    note: "User-controllable green LED. Default: heartbeat trigger."
  - name: "USR_LED1"
    linux_label: "am62:red:error"
    gpio: "GPIO0_18"

# ─── Ethernet ─────────────────────────────────────────────────────────────────────
ethernet:
  - name: "ETH0"
    connector: "J26"
    phy: "DP83826I"
    interface: "RGMII"
    linux_interface: "eth0"
    speed: "100Mbps"
    note: "CPSW3G port 1"
